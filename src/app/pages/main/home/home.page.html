<app-header [showMenu]="true" title="Inicio"></app-header>

<ion-content>
    @if(!loading){


    <ion-list>
        @for (product of products; track product.id) {
        <ion-item-sliding class="product-item">
            <ion-item>

                <ion-avatar slot="start">
                    <img [src]="product.img" alt="">
                </ion-avatar>
                <ion-label>
                    <div class="name">{{product.nameProduct}}</div>
                    <div class="data">
                        <strong>Precio Producto:</strong> {{product.price| currency:'COP':'symbol':'1.0-0'}} <br>
                        <strong>Cantidad:</strong> {{product.amount}} <br>
                    </div>
                </ion-label>
            </ion-item>
            <ion-item-options>
                <ion-item-option>
                    <ion-icon class="option-btn" name="create-outline"></ion-icon>
                </ion-item-option>
                <ion-item-option>
                    <ion-icon class="option-btn" name="trash-outline" color="danger"></ion-icon>
                </ion-item-option>
            </ion-item-options>

        </ion-item-sliding>
        }
    </ion-list>
     }

   <ion-fab vertical="bottom" horizontal="center" slot="fixed">
  <ion-fab-button (click)="addUpdateProducto()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

  
</ion-content>
