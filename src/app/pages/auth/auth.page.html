<app-header title="Iniciar Sesión"></app-header>
<ion-content>
  <div class="d-flex-center">
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" (keypress.enter)="submit()">
      <app-logo></app-logo>
      <app-login-input autocomplete="email" type="email" label="Correo" icon="mail-outline"
        [control]="form.controls.email"></app-login-input>
      <div class="validators">
        @if (form.controls.email.errors?.['required']) {
        <div>El correo es requerido</div>
        }
        @if (form.controls.email.errors?.['email']) {
        <div>Ingrese un correo válido</div>
        }
      </div>
      <app-login-input type="password" label="Contraseña" icon="lock-closed-outline"
        [control]="form.controls.password"></app-login-input>
      <div class="validators">
        @if (form.controls.password.errors?.['required']) {
        <div>La contraseña es requerida</div>
        }
      </div>
      <p routerLink="forgot-password">¿Olvidasate la Contraseña?</p>
      <ion-button class="submit" type="submit" expand="block" mode="ios" fill="outline" [disabled]="form.invalid">Ingresar</ion-button>
      <ion-button routerLink="sign-up" class="ion-margin-top" expand="block" mode="ios"
        fill="outline">Registrase</ion-button>
    </form>
  </div>
</ion-content>
