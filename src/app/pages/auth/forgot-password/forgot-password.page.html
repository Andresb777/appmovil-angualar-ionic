<app-header backButton="/auth" title="Recuperar Contraseña"></app-header>
<ion-content>
  <div class="d-flex-center">

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" (keypress.enter)="submit()">

      <app-logo></app-logo>

      <p class="io-text-center">Ingresa tu correo electronico para enviarte email de recuperación</p>

      <app-login-input autocomplete="email" type="email" label="Correo" icon="mail-outline"
        [control]="form.controls.email"></app-login-input>
      <div class="validators">
        @if (form.controls.email.errors?.['required']) {
        <div>El correo es requerido</div>
        }
        @if (form.controls.email.errors?.['email']) {
        <div>Ingrese un correo válido</div>
        }
      </div>

      <div class="validators"></div>
      <ion-button class="submit" type="submit" expand="block" mode="ios" fill="outline" [disabled]="form.invalid">
        Recuperar
        <ion-icon slot="end" name="arrow-forward"></ion-icon>
      </ion-button>
    </form>
  </div>
</ion-content>
